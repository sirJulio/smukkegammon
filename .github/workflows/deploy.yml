# Builds the wildbg backgammon engine to WebAssembly, adds it to the site, and deploys to Cloudflare.
# Deploying needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Without them the job still builds and offers the finished site as a downloadable artifact.
name: Build and deploy

on:
  push:
    branches: [main, sandbox]
  workflow_dispatch:

permissions:
  contents: read

env:
  # wildbg code (main) and its stronger neural networks (nets branch), pinned for repeatable builds
  WILDBG_REPO: https://github.com/carsten-wenderdel/wildbg
  WILDBG_CODE: d000b0e3c9b143640636882a657f27e67c89361f
  WILDBG_NETS: 8c42b06f2ff4868431fc0372b2787e612537317d
  # Ted Hwa's gnubg_web (GNU Backgammon 1.05 for the browser), pinned
  GNUBG_WEB: 95d0ffcbaa3f891571c28af5ba57ec831c6ee000

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The wildbg engine is pinned, so build it once and reuse it until the pin or the fast-engine patch changes.
      - name: Reuse the built wildbg engine if nothing about it changed
        id: wbcache
        uses: actions/cache@v4
        with:
          path: public/backgammon/wildbg
          key: wildbg-${{ env.WILDBG_CODE }}-${{ env.WILDBG_NETS }}-${{ hashFiles('scripts/add_fast_engine.py') }}-v1

      - name: Fetch wildbg and its stronger networks
        if: steps.wbcache.outputs.cache-hit != 'true'
        run: |
          git init -q wildbg && cd wildbg
          git remote add origin "$WILDBG_REPO"
          git fetch -q --depth 1 origin "$WILDBG_CODE" && git checkout -q FETCH_HEAD
          git fetch -q --depth 1 origin "$WILDBG_NETS"
          git checkout -q FETCH_HEAD -- neural-nets/contact.onnx neural-nets/race.onnx
          ls -l neural-nets

      - uses: dtolnay/rust-toolchain@stable
        if: steps.wbcache.outputs.cache-hit != 'true'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: steps.wbcache.outputs.cache-hit != 'true'
        with:
          workspaces: wildbg

      - name: Add the fast one-ply engine
        if: steps.wbcache.outputs.cache-hit != 'true'
        run: python3 scripts/add_fast_engine.py wildbg/crates/wildbg-wasm/src/lib.rs

      - name: Build wildbg for WebAssembly (optimised for size)
        if: steps.wbcache.outputs.cache-hit != 'true'
        working-directory: wildbg
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_STRIP: "true"
          CARGO_PROFILE_RELEASE_DEBUG: "false"
          CARGO_PROFILE_RELEASE_PANIC: "abort"
        run: cargo build --release --package wildbg-wasm --target wasm32-unknown-unknown

      - name: Install the matching wasm-bindgen
        if: steps.wbcache.outputs.cache-hit != 'true'
        run: |
          VER=$(grep -A1 '^name = "wasm-bindgen"$' wildbg/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          echo "wasm-bindgen $VER"
          cargo install wasm-bindgen-cli --version "$VER" --locked

      - name: Generate browser bindings into the site
        if: steps.wbcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p public/backgammon/wildbg
          wasm-bindgen --target web --no-typescript --out-dir public/backgammon/wildbg \
            wildbg/target/wasm32-unknown-unknown/release/wildbg_wasm.wasm
          sudo apt-get install -y -qq binaryen >/dev/null
          wasm-opt --version
          W=public/backgammon/wildbg/wildbg_wasm_bg.wasm
          echo "before wasm-opt: $(stat -c%s $W) bytes"
          wasm-opt -Oz --all-features --strip-debug --strip-producers -o $W.opt $W && mv $W.opt $W
          cp wildbg/LICENSE-MIT wildbg/LICENSE-APACHE public/backgammon/wildbg/
          echo "### wildbg build" >> "$GITHUB_STEP_SUMMARY"
          for f in public/backgammon/wildbg/*; do
            echo "- $(basename "$f"): $(stat -c%s "$f") bytes, $(gzip -9 -c "$f" | wc -c) gzipped" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # GNU Backgammon (Ted Hwa's gnubg_web port) compiled to WebAssembly, used for deep analysis.
      # Pinned, so it is built once and reused until the pin changes.
      - name: Reuse the built GNU Backgammon engine if nothing about it changed
        id: gbcache
        uses: actions/cache@v4
        with:
          path: public/backgammon/gnubg
          key: gnubg-${{ env.GNUBG_WEB }}-fs-v1

      - name: Fetch the gnubg_web port
        if: steps.gbcache.outputs.cache-hit != 'true'
        run: |
          git init -q gnubg-web && cd gnubg-web
          git remote add origin https://github.com/hwatheod/gnubg-web
          git fetch -q --depth 1 origin "$GNUBG_WEB" && git checkout -q FETCH_HEAD

      - uses: mymindstorm/setup-emsdk@v14
        if: steps.gbcache.outputs.cache-hit != 'true'

      - name: Build GNU Backgammon for the browser
        if: steps.gbcache.outputs.cache-hit != 'true'
        working-directory: gnubg-web
        run: |
          ./build.sh 2>&1 | tail -5
          mkdir -p ../public/backgammon/gnubg
          cp build/gnubg.js build/gnubg.wasm build/gnubg.data ../public/backgammon/gnubg/
          cp COPYING ../public/backgammon/gnubg/COPYING.txt
          ls -l ../public/backgammon/gnubg

      - name: Stamp the build version
        run: |
          echo "$GITHUB_SHA" > public/backgammon/version.txt
          sed -i "s/__BUILD__/$GITHUB_SHA/" public/backgammon/index.html
          grep -c "$GITHUB_SHA" public/backgammon/index.html

      - name: Deploy to Cloudflare
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "$GITHUB_REF_NAME" = "sandbox" ]; then
            npx wrangler deploy --env sandbox | tee deploy.log
            grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 | sed 's/^/Sandbox: /' >> "$GITHUB_STEP_SUMMARY"
          else
            npx wrangler deploy
          fi

      - name: Note when deploy is skipped
        if: ${{ env.CF_TOKEN == '' }}
        run: echo "No CLOUDFLARE_API_TOKEN secret yet, so the site was built but not deployed." | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: public
