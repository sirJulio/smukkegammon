name = "games-jdunne"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Sandbox: the "sandbox" branch deploys here (its own Worker and its own rooms, on workers.dev),
# so new features can be tried without touching games.jdunne.au.
[env.sandbox]
name = "games-jdunne-sandbox"

[[env.sandbox.durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"
