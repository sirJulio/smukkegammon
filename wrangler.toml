name = "games-jdunne"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Kris Kringle events, one Durable Object per event (src/kk.js)
[[durable_objects.bindings]]
name = "EVENTS"
class_name = "KKEvent"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KKEvent"]

# Players (name + PIN). Table "players"; see claim() in src/worker.js
[[d1_databases]]
binding = "DB"
database_name = "smukkegammon-players"
database_id = "5248c26d-1a38-4ee0-82bb-e6a8c0a8bcaf"

# Sandbox: the "sandbox" branch deploys here (its own Worker and its own rooms, on workers.dev),
# so new features can be tried without touching games.jdunne.au.
[env.sandbox]
name = "games-jdunne-sandbox"

[[env.sandbox.durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[env.sandbox.durable_objects.bindings]]
name = "EVENTS"
class_name = "KKEvent"

[[env.sandbox.d1_databases]]
binding = "DB"
database_name = "smukkegammon-players-sandbox"
database_id = "93262e44-7df2-4187-b17c-7a9b35dea797"
